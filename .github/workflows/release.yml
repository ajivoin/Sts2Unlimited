name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version bump from conventional commits
        id: version
        run: |
          # Get the last release tag
          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found, defaulting to minor bump"
            BUMP_TYPE="minor"
          else
            echo "Last tag: $LAST_TAG"
            # Collect commit messages since last tag
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s")
            echo "Commits since $LAST_TAG:"
            echo "$COMMITS"

            BUMP_TYPE="patch"
            while IFS= read -r msg; do
              # Breaking change: feat!:, fix!:, or BREAKING CHANGE in body
              if echo "$msg" | grep -qE '^[a-z]+(\([^)]+\))?!:' || echo "$msg" | grep -q 'BREAKING CHANGE'; then
                BUMP_TYPE="major"
                break
              fi
              # New feature: bump to at least minor
              if echo "$msg" | grep -qE '^feat(\([^)]+\))?:'; then
                BUMP_TYPE="minor"
              fi
            done <<< "$COMMITS"
          fi

          echo "Bump type: $BUMP_TYPE"

          VERSION=$(jq -r '.version' Sts2Unlimited.json | sed 's/^v//')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          case "$BUMP_TYPE" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              ;;
          esac

          jq --arg v "v$NEW_VERSION" '.version = $v' Sts2Unlimited.json > tmp.json && mv tmp.json Sts2Unlimited.json
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
          echo "Bumped version: $VERSION → $NEW_VERSION ($BUMP_TYPE)"

      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v6.1.0
        with:
          path: .godot-bin
          key: godot-4.5.1-linux-editor

      - name: Download Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip"
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          mkdir -p .godot-bin
          mv Godot_v4.5.1-stable_linux.x86_64 .godot-bin/godot
          chmod +x .godot-bin/godot

      - name: Regenerate PCK with bumped version
        run: .godot-bin/godot --headless --export-pack "Windows Desktop" Sts2Unlimited.pck

      # sts2.dll is all the mod build needs. The headless patch harness also needs the
      # two Sentry assemblies: sts2.dll's module initializer loads them on first type
      # access. Without them the harness still builds (MSB3245 is only a warning) and
      # then crashes at startup, so check for all three here and fail with a clear message.
      - name: Download game assemblies from release assets
        env:
          GH_TOKEN: ${{ secrets.STS2_DLL_PAT }}
        run: |
          gh release download deps --repo "${{ github.repository }}" \
            --pattern "sts2.dll" --pattern "Sentry.dll" --pattern "Sentry.Godot.dll"
          for f in sts2.dll Sentry.dll Sentry.Godot.dll; do
            [ -f "$f" ] || { echo "::error::$f is missing from the 'deps' release (copy it from <steam>/steamapps/common/Slay the Spire 2/data_sts2_windows_x86_64/)"; exit 1; }
          done

      # The reference assembly is a release asset, not a tracked file, so it can
      # fall behind the game without anything in a diff to show it — it has
      # happened twice (a March build was still in use in September, and a
      # September build during v0.113.0). The patches bind to game types at
      # compile time, so a stale DLL does fail the build, but with errors like
      # "namespace 'Blitz' does not exist" that read as a mod bug rather than a
      # stale dependency. Check it up front and say so plainly instead.
      - name: Verify sts2.dll is a supported game build
        run: |
          echo "sts2.dll: $(stat -c%s sts2.dll) bytes, md5 $(md5sum sts2.dll | cut -d' ' -f1)"
          missing=""
          for marker in HoldersInUse NBlitzScreen; do
            grep -aq "$marker" sts2.dll || missing="$missing $marker"
          done
          if [ -n "$missing" ]; then
            echo "::error::sts2.dll predates game build v0.113.0 (missing:$missing)."
            echo "::error::Upload a current one to the 'deps' release:"
            echo "::error::  gh release upload deps \\"
            echo "::error::    \"<steam>/steamapps/common/Slay the Spire 2/data_sts2_windows_x86_64/sts2.dll\" \\"
            echo "::error::    --repo ${{ github.repository }} --clobber"
            exit 1
          fi
          echo "sts2.dll looks like v0.113.0 or newer."

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '9.0.x'

      # Binds every patch target, runs the real transpilers over the real game IL,
      # and checks every game type name the mod looks up by string. Nothing else in
      # CI runs it, and a broken binding still builds cleanly. Needs all three DLLs
      # downloaded above.
      - name: Run headless patch harness
        run: dotnet run --project tests/PatchTests

      - name: Build and bundle
        run: dotnet build --configuration ExportRelease
        # The BundleRelease MSBuild target copies all mod files to release/

      - name: Zip release directory
        run: |
          cd release
          zip -r ../Sts2Unlimited.zip .
          echo "Archive contents:"
          zipinfo ../Sts2Unlimited.zip

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Sts2Unlimited.json Sts2Unlimited.pck
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: Sts2Unlimited.zip
          generate_release_notes: true
